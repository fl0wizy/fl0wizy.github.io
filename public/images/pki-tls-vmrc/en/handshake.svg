<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-size="12">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9580ff"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8a98"/></marker>
  </defs>
  <rect width="760" height="400" fill="#0c0c18"/>

  <rect x="30" y="20" width="130" height="30" rx="4" fill="#1a1836" stroke="#9580ff"/>
  <text x="62" y="40" fill="#e8e8f0">Client</text>
  <rect x="600" y="20" width="130" height="30" rx="4" fill="#1a1836" stroke="#9580ff"/>
  <text x="634" y="40" fill="#e8e8f0">Server</text>
  <path d="M95 50 L95 380" stroke="#2a2a48" stroke-dasharray="4 4"/>
  <path d="M665 50 L665 380" stroke="#2a2a48" stroke-dasharray="4 4"/>

  <text x="40" y="82" fill="#8a8a98" font-size="11">TCP</text>
  <path d="M95 86 L661 86" stroke="#8a8a98" stroke-width="1.2" fill="none" marker-end="url(#a2)"/>
  <text x="170" y="80" fill="#8a8a98">SYN / SYN-ACK / ACK</text>
  <text x="170" y="102" fill="#e0785a" font-size="11">✕ refused = nobody on the port · timeout = firewall</text>

  <text x="40" y="136" fill="#9580ff" font-size="11">① </text>
  <path d="M95 140 L661 140" stroke="#9580ff" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <text x="170" y="134" fill="#e8e8f0">ClientHello</text>
  <text x="170" y="156" fill="#8a8a98" font-size="11">supported TLS versions · cipher suites · key_share · SNI</text>

  <text x="40" y="192" fill="#9580ff" font-size="11">② </text>
  <path d="M665 196 L99 196" stroke="#9580ff" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
  <text x="170" y="190" fill="#e8e8f0">ServerHello</text>
  <text x="170" y="212" fill="#8a8a98" font-size="11">chosen version · chosen cipher suite · key_share</text>
  <text x="170" y="230" fill="#e0785a" font-size="11">✕ empty intersection ends it here → handshake failure / protocol version</text>

  <text x="40" y="266" fill="#9580ff" font-size="11">③ </text>
  <path d="M665 270 L99 270" stroke="#8a8a98" stroke-width="1.2" fill="none" marker-end="url(#a2)"/>
  <text x="170" y="264" fill="#e8e8f0">Certificate + CertificateVerify</text>
  <text x="170" y="286" fill="#8a8a98" font-size="11">server cert chain · proof of private key (encrypted from here on)</text>
  <text x="170" y="304" fill="#e0785a" font-size="11">✕ fails here if no root is reached → unable to get local issuer / cert warning</text>

  <text x="40" y="340" fill="#9580ff" font-size="11">④ </text>
  <path d="M95 344 L661 344" stroke="#8a8a98" stroke-width="1.2" fill="none" marker-end="url(#a2)"/>
  <text x="170" y="338" fill="#e8e8f0">Finished</text>
  <text x="170" y="360" fill="#8a8a98" font-size="11">both confirm the same session key → all app data symmetrically encrypted after this</text>

  <text x="40" y="388" fill="#6fcf97" font-size="11">As of TLS 1.3. Certificate verification (③) happens only after negotiation (②) finishes.</text>
</svg>
