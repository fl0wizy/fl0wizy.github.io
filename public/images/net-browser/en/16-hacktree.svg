<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="740" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">hack-tree – this series' layers inside one deployed system</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">The number at each box's top right is the part covering that component</text>

  <!-- CI -->
  <rect x="40" y="80" width="920" height="112" rx="10" fill="#1f1a12" stroke="#e6a572"/>
  <text x="60" y="104" fill="#f0cba8" font-size="12" font-weight="700">Build path – GitHub Actions</text>
  <text x="930" y="104" text-anchor="end" fill="#8a8aa0" font-size="10">Part 14</text>
  <g text-anchor="middle">
    <rect x="60" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="135" y="140" fill="#c8c8d8" font-size="10.5">Tests</text>
    <text x="135" y="158" fill="#8a8aa0" font-size="9.5">vitest · pytest · bats</text>

    <rect x="230" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="305" y="140" fill="#c8c8d8" font-size="10.5">Image build ×3</text>
    <text x="305" y="158" fill="#8a8aa0" font-size="9.5">web · api · backup</text>

    <rect x="400" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="475" y="140" fill="#c8c8d8" font-size="10.5">GHCR push</text>
    <text x="475" y="158" fill="#8a8aa0" font-size="9.5">:latest + :&lt;commit sha&gt;</text>

    <rect x="570" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="645" y="140" fill="#c8c8d8" font-size="10.5">SSH deploy</text>
    <text x="645" y="158" fill="#8a8aa0" font-size="9.5">the server only pulls</text>

    <rect x="740" y="118" width="200" height="54" rx="7" fill="#12201c" stroke="#34d399"/>
    <text x="840" y="140" fill="#a7f3d0" font-size="10.5">health check → roll back on failure</text>
    <text x="840" y="158" fill="#8a8aa0" font-size="9.5">the SHA tag makes a point to return to</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.2" marker-end="url(#n1)">
    <line x1="210" y1="145" x2="228" y2="145"/>
    <line x1="380" y1="145" x2="398" y2="145"/>
    <line x1="550" y1="145" x2="568" y2="145"/>
    <line x1="720" y1="145" x2="738" y2="145"/>
  </g>

  <!-- 런타임 -->
  <rect x="40" y="208" width="920" height="286" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="232" fill="#e8e8f0" font-size="12" font-weight="700">Runtime – GCP VM (Ubuntu 24.04, static IP) · codified with Terraform + cloud-init</text>
  <text x="930" y="232" text-anchor="end" fill="#8a8aa0" font-size="10">Part 14</text>

  <rect x="60" y="246" width="880" height="70" rx="8" fill="#141a22" stroke="#6f9fd8"/>
  <text x="78" y="268" fill="#bcd6f0" font-size="11.5" font-weight="600">Caddy – the only ports open externally, :80 / :443</text>
  <text x="920" y="268" text-anchor="end" fill="#8a8aa0" font-size="10">Parts 05 · 10 · 14</text>
  <text x="78" y="288" fill="#c8c8d8" font-size="10.5">automatic Let's Encrypt certificates · HSTS · nosniff · Referrer-Policy · Server header removed</text>
  <text x="78" y="306" fill="#8a8aa0" font-size="10.5">/api/* → api:8000 · everything else → web:3000  (TLS ends here – behind it is the internal Docker network)</text>

  <g>
    <rect x="60" y="330" width="280" height="90" rx="8" fill="#161226" stroke="#8b7cf6"/>
    <text x="78" y="352" fill="#d8d0f8" font-size="11.5" font-weight="600">web – Next.js 15 / React 19</text>
    <text x="322" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">Parts 09 · 11</text>
    <text x="78" y="372" fill="#c8c8d8" font-size="10.5">renders 533 markdown nodes</text>
    <text x="78" y="390" fill="#8a8aa0" font-size="10.5">embeddings, graph and quizzes built at build time</text>
    <text x="78" y="408" fill="#8a8aa0" font-size="10.5">/api/* rewrite → same origin, no CORS needed</text>

    <rect x="360" y="330" width="280" height="90" rx="8" fill="#1a1420" stroke="#db8fb4"/>
    <text x="378" y="352" fill="#f0c0d8" font-size="11.5" font-weight="600">api – FastAPI / Python 3.12</text>
    <text x="622" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">Part 12</text>
    <text x="378" y="372" fill="#c8c8d8" font-size="10.5">cookie sessions · argon2 · RBAC · invite-only</text>
    <text x="378" y="390" fill="#8a8aa0" font-size="10.5">alembic upgrade head on start</text>
    <text x="378" y="408" fill="#8a8aa0" font-size="10.5">the quiz answer key exists only in this image</text>

    <rect x="660" y="330" width="280" height="90" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="678" y="352" fill="#a7f3d0" font-size="11.5" font-weight="600">SQLite + backup sidecar</text>
    <text x="922" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">Part 13</text>
    <text x="678" y="372" fill="#c8c8d8" font-size="10.5">progress · quiz results · sessions · news</text>
    <text x="678" y="390" fill="#8a8aa0" font-size="10.5">sqlite3 .backup → integrity_check → rotate</text>
    <text x="678" y="408" fill="#8a8aa0" font-size="10.5">the data volume is mounted read-only</text>
  </g>

  <rect x="60" y="434" width="880" height="46" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="78" y="454" fill="#e8b0b0" font-size="11" font-weight="600">No public sign-up – invitation only</text>
  <text x="78" y="470" fill="#c8c8d8" font-size="10.5">A decision cutting attack surface by removing a feature. Password reset, email verification, spam handling and account enumeration all disappear.</text>

  <!-- 결정과 대가 -->
  <rect x="40" y="510" width="450" height="216" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="534" fill="#e8e8f0" font-size="12" font-weight="700">Where it got stuck, and the fixes</text>
  <text x="60" y="558" fill="#e6a572" font-size="10.5" font-weight="600">① native modules would not load on alpine</text>
  <text x="72" y="576" fill="#8a8aa0" font-size="10">the search ONNX runtime and image module fetch glibc-only</text>
  <text x="72" y="592" fill="#8a8aa0" font-size="10">prebuilts → unified every stage on slim (glibc)</text>
  <text x="60" y="616" fill="#e6a572" font-size="10.5" font-weight="600">② where to keep a 135MB embedding model</text>
  <text x="72" y="634" fill="#8a8aa0" font-size="10">Git LFS was dropped over bandwidth limits. Instead a script</text>
  <text x="72" y="650" fill="#8a8aa0" font-size="10">downloads from a pinned revision and verifies the sha256.</text>
  <text x="72" y="666" fill="#34d399" font-size="10">→ supply chain integrity came as a side effect (Part 14)</text>
  <text x="60" y="690" fill="#e6a572" font-size="10.5" font-weight="600">③ where to write the dev/production difference</text>
  <text x="72" y="708" fill="#8a8aa0" font-size="10">split into three compose files – base / dev / production.</text>

  <rect x="510" y="510" width="450" height="216" rx="10" fill="#161226" stroke="#8b7cf6"/>
  <text x="530" y="534" fill="#d8d0f8" font-size="12" font-weight="700">What this project actually taught</text>
  <text x="530" y="558" fill="#c8c8d8" font-size="10.5">· where TLS ends is decided by the deployment config – one line</text>
  <text x="542" y="574" fill="#8a8aa0" font-size="10.5">of Caddyfile moves that boundary, not documentation</text>
  <text x="530" y="596" fill="#c8c8d8" font-size="10.5">· proxy to the same origin and CORS configuration disappears –</text>
  <text x="542" y="612" fill="#8a8aa0" font-size="10.5">making a header unnecessary is safer than using it well</text>
  <text x="530" y="634" fill="#c8c8d8" font-size="10.5">· the only way not to send the answer key to the client is to</text>
  <text x="542" y="650" fill="#8a8aa0" font-size="10.5">keep it outside the static serving path (Part 11's boundary)</text>
  <text x="530" y="672" fill="#c8c8d8" font-size="10.5">· the tag decides whether a deploy can roll back – a moving tag</text>
  <text x="542" y="688" fill="#8a8aa0" font-size="10.5">cannot identify a point to return to (Part 14)</text>
  <text x="530" y="712" fill="#a7f3d0" font-size="10.5" font-weight="600">Most of the difference between knowing by reading and knowing by shipping was here.</text>
</svg>
