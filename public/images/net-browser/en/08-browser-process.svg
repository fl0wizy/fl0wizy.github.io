<svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
    <marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db8585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">The browser process model – making the trust boundary a process boundary</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">Assume the attacker compromises the renderer. On that assumption, what goes where is the whole design.</text>

  <!-- 신뢰 구역 -->
  <rect x="40" y="80" width="440" height="250" rx="10" fill="#101a18" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="104" fill="#a7f3d0" font-size="12.5" font-weight="700">Trusted zone – full user privilege</text>

  <rect x="60" y="118" width="400" height="70" rx="8" fill="#12201c" stroke="#34d399"/>
  <text x="78" y="140" fill="#e8e8f0" font-size="12" font-weight="600">Browser process (broker)</text>
  <text x="78" y="160" fill="#c8c8d8" font-size="10.5">file access · network requests · cookie store · UI · permission decisions</text>
  <text x="78" y="178" fill="#8a8aa0" font-size="10.5">Every resource request from a renderer has to pass through here.</text>

  <rect x="60" y="200" width="192" height="56" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="78" y="222" fill="#c8c8d8" font-size="11">Network process</text>
  <text x="78" y="240" fill="#8a8aa0" font-size="10">sockets · TLS · attaching cookies</text>

  <rect x="268" y="200" width="192" height="56" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="286" y="222" fill="#c8c8d8" font-size="11">GPU process</text>
  <text x="286" y="240" fill="#8a8aa0" font-size="10">raster · compositing · touching drivers</text>

  <rect x="60" y="268" width="400" height="46" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="78" y="288" fill="#c8c8d8" font-size="11">Utility process</text>
  <text x="78" y="304" fill="#8a8aa0" font-size="10">where format parsing such as image and audio decoding is split out</text>

  <!-- 비신뢰 구역 -->
  <rect x="520" y="80" width="440" height="250" rx="10" fill="#1f1418" stroke="#db8585" stroke-width="1.5"/>
  <text x="540" y="104" fill="#e8b0b0" font-size="12.5" font-weight="700">Untrusted zone – sandboxed, stripped of privilege</text>

  <rect x="540" y="118" width="190" height="86" rx="8" fill="#161226" stroke="#8b7cf6"/>
  <text x="558" y="140" fill="#d8d0f8" font-size="11" font-weight="600">Renderer A</text>
  <text x="558" y="158" fill="#8a8aa0" font-size="10">site: https://bank.com</text>
  <text x="558" y="176" fill="#8a8aa0" font-size="10">HTML parsing · DOM · CSS</text>
  <text x="558" y="194" fill="#8a8aa0" font-size="10">JS engine · layout · paint</text>

  <rect x="746" y="118" width="194" height="86" rx="8" fill="#1a1420" stroke="#db8fb4"/>
  <text x="764" y="140" fill="#f0c0d8" font-size="11" font-weight="600">Renderer B</text>
  <text x="764" y="158" fill="#8a8aa0" font-size="10">site: https://ads.example</text>
  <text x="764" y="176" fill="#8a8aa0" font-size="10">even as an iframe inside A's page,</text>
  <text x="764" y="194" fill="#8a8aa0" font-size="10">a different site means a separate process</text>

  <rect x="540" y="216" width="400" height="98" rx="8" fill="#1a1012" stroke="#db8585"/>
  <text x="558" y="238" fill="#e8b0b0" font-size="11" font-weight="600">What a renderer cannot do directly</text>
  <text x="558" y="258" fill="#c8c8d8" font-size="10.5">open files · open sockets · read cookies · touch another process's memory</text>
  <text x="558" y="278" fill="#8a8aa0" font-size="10.5">All of it is requested from the broker over IPC (Mojo), and the broker decides.</text>
  <text x="558" y="300" fill="#e8b0b0" font-size="10.5" font-weight="600">→ fully compromising a renderer still reads not one file by itself.</text>

  <g stroke="#5a5a78" stroke-width="1.4" marker-end="url(#h1)">
    <line x1="538" y1="160" x2="462" y2="160"/>
    <line x1="462" y1="176" x2="538" y2="176"/>
  </g>
  <text x="500" y="204" text-anchor="middle" fill="#8a8aa0" font-size="9.5">IPC</text>

  <!-- Site Isolation -->
  <rect x="40" y="350" width="440" height="150" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="374" fill="#e8e8f0" font-size="12" font-weight="700">The definition of "site" – coarser than origin</text>
  <text x="60" y="396" fill="#c8c8d8" font-size="10.5">scheme + registrable domain (including the public suffix). Subdomain, port and path ignored.</text>
  <rect x="60" y="408" width="400" height="44" rx="6" fill="#141a22" stroke="#6f9fd8"/>
  <text x="76" y="428" fill="#bcd6f0" font-size="11" font-family="Menlo, monospace">https://foo.example.com:8080</text>
  <text x="76" y="445" fill="#8a8aa0" font-size="11" font-family="Menlo, monospace">→ site = https://example.com</text>
  <text x="60" y="472" fill="#8a8aa0" font-size="10.5">Why so coarse – compatibility with old pages that modify document.domain.</text>
  <text x="60" y="490" fill="#e6a572" font-size="10.5" font-weight="600">The price: subdomains are not separated into different processes.</text>

  <!-- 동기 -->
  <rect x="520" y="350" width="440" height="150" rx="10" fill="#1f1a12" stroke="#e6a572"/>
  <text x="540" y="374" fill="#f0cba8" font-size="12" font-weight="700">Why this cost was accepted</text>
  <text x="540" y="396" fill="#c8c8d8" font-size="10.5">① the renderer is eventually breached – high/critical renderer bugs have been</text>
  <text x="552" y="412" fill="#8a8aa0" font-size="10.5">reported at 5~15 per Chrome release.</text>
  <text x="540" y="434" fill="#c8c8d8" font-size="10.5">② UXSS – the bug class bypassing the same-origin policy inside the renderer.</text>
  <text x="540" y="456" fill="#c8c8d8" font-size="10.5">③ Spectre – renderer memory can be read even with no bug in Chrome.</text>
  <text x="540" y="480" fill="#e6a572" font-size="10.5" font-weight="600">Conclusion: data that must not be read is not put in that process at all.</text>

  <!-- 2단계 -->
  <rect x="40" y="520" width="920" height="150" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="544" fill="#e8e8f0" font-size="12.5" font-weight="700">So a browser exploit is always two stages</text>

  <rect x="60" y="558" width="400" height="46" rx="7" fill="#1f1418" stroke="#db8585"/>
  <text x="78" y="578" fill="#e8b0b0" font-size="11" font-weight="600">Stage 1 – code execution inside the renderer</text>
  <text x="78" y="594" fill="#8a8aa0" font-size="10.5">memory bugs in the JS engine · parsers · DOM implementation</text>

  <line x1="466" y1="580" x2="516" y2="580" stroke="#db8585" stroke-width="1.6" marker-end="url(#h2)"/>

  <rect x="530" y="558" width="430" height="46" rx="7" fill="#1f1418" stroke="#db8585"/>
  <text x="548" y="578" fill="#e8b0b0" font-size="11" font-weight="600">Stage 2 – sandbox escape</text>
  <text x="548" y="594" fill="#8a8aa0" font-size="10.5">missing validation at the IPC boundary, or a kernel/driver vulnerability</text>

  <text x="60" y="628" fill="#c8c8d8" font-size="10.5">Stage 1 alone reaches only that site's data. Taking the device needs stage 2, which is why browser exploits are chains.</text>
  <text x="60" y="650" fill="#8a8aa0" font-size="10.5">On desktop this structure's memory overhead is reported at 10~13% with many tabs. A trade buying security with memory.</text>
</svg>
