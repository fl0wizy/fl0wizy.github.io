<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db8585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">The deployment path – how a request reaches the app, and how code reaches the server</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">The first path is well guarded and the second often forgotten. The attacker looks at both.</text>

  <!-- 요청 경로 -->
  <text x="40" y="90" fill="#8a8aa0" font-size="11" font-weight="600">① The user request path</text>
  <g text-anchor="middle">
    <rect x="40" y="102" width="132" height="56" rx="8" fill="#161226" stroke="#8b7cf6"/>
    <text x="106" y="124" fill="#d8d0f8" font-size="11" font-weight="600">Browser</text>
    <text x="106" y="142" fill="#8a8aa0" font-size="9.5">untrusted</text>

    <rect x="196" y="102" width="132" height="56" rx="8" fill="#141a22" stroke="#6f9fd8"/>
    <text x="262" y="124" fill="#bcd6f0" font-size="11" font-weight="600">CDN · edge</text>
    <text x="262" y="142" fill="#8a8aa0" font-size="9.5">TLS termination · cache</text>

    <rect x="352" y="102" width="132" height="56" rx="8" fill="#141a22" stroke="#6f9fd8"/>
    <text x="418" y="124" fill="#bcd6f0" font-size="11" font-weight="600">Load balancer</text>
    <text x="418" y="142" fill="#8a8aa0" font-size="9.5">distribution · health checks</text>

    <rect x="508" y="102" width="132" height="56" rx="8" fill="#1f1a12" stroke="#e6a572"/>
    <text x="574" y="124" fill="#f0cba8" font-size="11" font-weight="600">Reverse proxy</text>
    <text x="574" y="142" fill="#8a8aa0" font-size="9.5">path routing · header edits</text>

    <rect x="664" y="102" width="132" height="56" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="730" y="124" fill="#a7f3d0" font-size="11" font-weight="600">App server</text>
    <text x="730" y="142" fill="#8a8aa0" font-size="9.5">business logic</text>

    <rect x="820" y="102" width="140" height="56" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="890" y="124" fill="#a7f3d0" font-size="11" font-weight="600">DB · cache</text>
    <text x="890" y="142" fill="#8a8aa0" font-size="9.5">inside the private net</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.3" marker-end="url(#m1)">
    <line x1="172" y1="130" x2="194" y2="130"/>
    <line x1="328" y1="130" x2="350" y2="130"/>
    <line x1="484" y1="130" x2="506" y2="130"/>
    <line x1="640" y1="130" x2="662" y2="130"/>
    <line x1="796" y1="130" x2="818" y2="130"/>
  </g>

  <rect x="196" y="172" width="288" height="72" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="214" y="192" fill="#e8b0b0" font-size="10.5" font-weight="600">Where encryption ends</text>
  <text x="214" y="210" fill="#c8c8d8" font-size="10">From here on it is plaintext, or a separate internal TLS.</text>
  <text x="214" y="228" fill="#8a8aa0" font-size="10">A party that can read and edit the plaintext sits in the middle of the path.</text>

  <rect x="508" y="172" width="452" height="72" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="526" y="192" fill="#e8b0b0" font-size="10.5" font-weight="600">The client IP becomes "a value written in a header" here</text>
  <text x="526" y="210" font-family="Menlo, monospace" font-size="10" fill="#c8c8d8">X-Forwarded-For: 1.2.3.4, 10.0.0.9, 10.0.0.3</text>
  <text x="526" y="228" fill="#8a8aa0" font-size="10">Unless the proxy strips it, clients forge the front. Set the trusted hop count.</text>

  <!-- 격리 -->
  <text x="40" y="280" fill="#8a8aa0" font-size="11" font-weight="600">② Isolation of the execution environment – what is shared</text>
  <rect x="40" y="292" width="450" height="130" rx="9" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="314" fill="#e8e8f0" font-size="11.5" font-weight="700">Containers</text>
  <text x="60" y="334" fill="#c8c8d8" font-size="10.5">namespaces (what it sees) + cgroups (how much it uses)</text>
  <text x="60" y="350" fill="#c8c8d8" font-size="10.5">+ capabilities (what it may do), combined</text>
  <text x="60" y="374" fill="#e8b0b0" font-size="10.5" font-weight="600">The kernel is shared with the host – the decisive difference from a VM</text>
  <text x="60" y="392" fill="#8a8aa0" font-size="10.5">So container escape is generally a kernel vulnerability attack.</text>
  <text x="60" y="410" fill="#8a8aa0" font-size="10.5">Privileged mode, mounting the host socket and running as root lower that bar.</text>

  <rect x="510" y="292" width="450" height="130" rx="9" fill="#12121f" stroke="#3a3a52"/>
  <text x="530" y="314" fill="#e8e8f0" font-size="11.5" font-weight="700">Orchestration</text>
  <text x="530" y="334" fill="#c8c8d8" font-size="10.5">The API server is a single control point, and so a single target.</text>
  <text x="530" y="354" fill="#8a8aa0" font-size="10.5">· with no network policy, pods sit on a flat network</text>
  <text x="530" y="372" fill="#8a8aa0" font-size="10.5">→ breach one and the whole inside comes into range</text>
  <text x="530" y="392" fill="#8a8aa0" font-size="10.5">· default secrets are merely encoding, not encryption</text>
  <text x="530" y="410" fill="#8a8aa0" font-size="10.5">· service account tokens are mounted inside the pod</text>

  <!-- 공급망 -->
  <text x="40" y="458" fill="#8a8aa0" font-size="11" font-weight="600">③ The path code takes to the server – more privilege than any user request</text>
  <g text-anchor="middle">
    <rect x="40" y="470" width="150" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="115" y="490" fill="#c8c8d8" font-size="10.5">Developer commit</text>
    <text x="115" y="507" fill="#8a8aa0" font-size="9.5">hundreds of dependencies</text>

    <rect x="214" y="470" width="150" height="50" rx="8" fill="#1f1a12" stroke="#e6a572"/>
    <text x="289" y="490" fill="#f0cba8" font-size="10.5" font-weight="600">CI runner</text>
    <text x="289" y="507" fill="#8a8aa0" font-size="9.5">holds deploy credentials</text>

    <rect x="388" y="470" width="150" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="463" y="490" fill="#c8c8d8" font-size="10.5">Image registry</text>
    <text x="463" y="507" fill="#8a8aa0" font-size="9.5">tags move</text>

    <rect x="562" y="470" width="150" height="50" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="637" y="490" fill="#a7f3d0" font-size="10.5">Production server</text>
    <text x="637" y="507" fill="#8a8aa0" font-size="9.5">pull + rollout</text>

    <rect x="736" y="470" width="224" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="848" y="490" fill="#c8c8d8" font-size="10.5">IaC · state file</text>
    <text x="848" y="507" fill="#8a8aa0" font-size="9.5">the whole blueprint and secrets</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.3" marker-end="url(#m1)">
    <line x1="190" y1="495" x2="212" y2="495"/>
    <line x1="364" y1="495" x2="386" y2="495"/>
    <line x1="538" y1="495" x2="560" y2="495"/>
  </g>

  <rect x="40" y="540" width="920" height="168" rx="10" fill="#1f1418" stroke="#db8585"/>
  <text x="60" y="564" fill="#e8b0b0" font-size="12.5" font-weight="700">The failures that recur on this path</text>
  <text x="60" y="588" fill="#c8c8d8" font-size="10.5">· an outside contributor's PR triggers a workflow with access to secrets – code runs before code review</text>
  <text x="60" y="608" fill="#c8c8d8" font-size="10.5">· third-party actions and images referenced by moving tags – the same tag can point elsewhere tomorrow (pin by hash)</text>
  <text x="60" y="628" fill="#c8c8d8" font-size="10.5">· internal package names claimed on a public registry – dependency confusion</text>
  <text x="60" y="648" fill="#c8c8d8" font-size="10.5">· IaC state files sitting in buckets with no access control, holding plaintext secrets</text>
  <text x="60" y="668" fill="#c8c8d8" font-size="10.5">· tokens, sessions and personal data left in logs as-is – log collectors usually have more people with access</text>
  <text x="60" y="692" fill="#e8b0b0" font-size="10.5" font-weight="600">In short: an application vulnerability gains user privilege, a pipeline vulnerability gains deploy privilege. The latter is always larger.</text>
</svg>
