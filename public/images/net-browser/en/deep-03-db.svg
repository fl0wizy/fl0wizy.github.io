<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
  </defs>
  <style>.mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }</style>

  <rect x="0" y="0" width="1000" height="740" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">Inside indexes and concurrency</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">What order keys go in, and what follows from each party seeing a different instant</text>

  <!-- 페이지 분할 -->
  <rect x="40" y="76" width="450" height="230" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="100" fill="#e8e8f0" font-size="12" font-weight="700">Insertion order changes write cost</text>

  <text x="60" y="124" fill="#a7f3d0" font-size="10.5" font-weight="600">Sequential keys (auto-increment · time-ordered IDs)</text>
  <g>
    <rect x="60" y="134" width="90" height="26" rx="4" fill="#12201c" stroke="#34d399"/>
    <text x="105" y="151" text-anchor="middle" class="mono" font-size="9.5" fill="#a7f3d0">full</text>
    <rect x="156" y="134" width="90" height="26" rx="4" fill="#12201c" stroke="#34d399"/>
    <text x="201" y="151" text-anchor="middle" class="mono" font-size="9.5" fill="#a7f3d0">full</text>
    <rect x="252" y="134" width="90" height="26" rx="4" fill="#141a22" stroke="#6f9fd8"/>
    <text x="297" y="151" text-anchor="middle" class="mono" font-size="9.5" fill="#bcd6f0">appended here</text>
  </g>
  <text x="60" y="178" fill="#8a8aa0" font-size="10">Always writes to the last page only. Barely any splits and pages fill densely.</text>

  <text x="60" y="206" fill="#e8b0b0" font-size="10.5" font-weight="600">Random keys (random UUID)</text>
  <g>
    <rect x="60" y="216" width="90" height="26" rx="4" fill="#1f1418" stroke="#db8585"/>
    <text x="105" y="233" text-anchor="middle" class="mono" font-size="9.5" fill="#e8b0b0">half full</text>
    <rect x="156" y="216" width="90" height="26" rx="4" fill="#1f1418" stroke="#db8585"/>
    <text x="201" y="233" text-anchor="middle" class="mono" font-size="9.5" fill="#e8b0b0">half full</text>
    <rect x="252" y="216" width="90" height="26" rx="4" fill="#1f1418" stroke="#db8585"/>
    <text x="297" y="233" text-anchor="middle" class="mono" font-size="9.5" fill="#e8b0b0">half full</text>
    <rect x="348" y="216" width="90" height="26" rx="4" fill="#1f1418" stroke="#db8585"/>
    <text x="393" y="233" text-anchor="middle" class="mono" font-size="9.5" fill="#e8b0b0">half full</text>
  </g>
  <text x="60" y="260" fill="#8a8aa0" font-size="10">Insertion positions scatter and middle pages split continually.</text>
  <text x="60" y="278" fill="#8a8aa0" font-size="10">Split pages sit about half full, so the index grows and cache hits fall.</text>
  <text x="60" y="296" fill="#e6a572" font-size="10">→ this property is why time-ordered UUIDs (the v7 family) appeared.</text>

  <!-- 세컨더리 인덱스 -->
  <rect x="510" y="76" width="450" height="230" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="530" y="100" fill="#e8e8f0" font-size="12" font-weight="700">How primary key size propagates into every index</text>
  <text x="530" y="124" fill="#c8c8d8" font-size="10.5">In engines with a clustered index the table itself is stored in</text>
  <text x="530" y="140" fill="#c8c8d8" font-size="10.5">primary key order, and secondary index leaves hold the primary</text>
  <text x="530" y="156" fill="#c8c8d8" font-size="10.5">key value rather than the row location.</text>
  <g>
    <rect x="530" y="172" width="190" height="44" rx="6" fill="#161226" stroke="#8b7cf6"/>
    <text x="546" y="190" class="mono" font-size="9.5" fill="#d8d0f8">secondary index leaf</text>
    <text x="546" y="206" class="mono" font-size="9.5" fill="#8a8aa0">[email] → [primary key]</text>
    <rect x="740" y="172" width="200" height="44" rx="6" fill="#12201c" stroke="#34d399"/>
    <text x="756" y="190" class="mono" font-size="9.5" fill="#a7f3d0">clustered index</text>
    <text x="756" y="206" class="mono" font-size="9.5" fill="#8a8aa0">[primary key] → [whole row]</text>
  </g>
  <line x1="722" y1="194" x2="738" y2="194" stroke="#5a5a78" stroke-width="1.3" marker-end="url(#p1)"/>
  <text x="530" y="240" fill="#e6a572" font-size="10.5" font-weight="600">Two consequences</text>
  <text x="530" y="258" fill="#8a8aa0" font-size="10">· a large primary key (a string UUID, say) grows every secondary index with it</text>
  <text x="530" y="276" fill="#8a8aa0" font-size="10">· a secondary index lookup happens twice (unless it is covering)</text>
  <text x="530" y="294" fill="#8a8aa0" font-size="10">The structure differs by engine – in heap storage the leaf holds the physical location</text>

  <!-- MVCC -->
  <rect x="40" y="322" width="450" height="200" rx="10" fill="#141a22" stroke="#6f9fd8"/>
  <text x="60" y="346" fill="#bcd6f0" font-size="12" font-weight="700">MVCC – reads do not block writes, in exchange for this</text>
  <text x="60" y="368" fill="#c8c8d8" font-size="10.5">An update does not overwrite the row but makes a new version. Each</text>
  <text x="60" y="384" fill="#c8c8d8" font-size="10.5">transaction reads the version visible at its own instant.</text>
  <g>
    <rect x="60" y="398" width="110" height="30" rx="5" fill="#12121f" stroke="#3a3a52"/>
    <text x="115" y="418" text-anchor="middle" class="mono" font-size="9.5" fill="#8a8aa0">v1 (old)</text>
    <rect x="180" y="398" width="110" height="30" rx="5" fill="#12121f" stroke="#3a3a52"/>
    <text x="235" y="418" text-anchor="middle" class="mono" font-size="9.5" fill="#8a8aa0">v2</text>
    <rect x="300" y="398" width="110" height="30" rx="5" fill="#12201c" stroke="#34d399"/>
    <text x="355" y="418" text-anchor="middle" class="mono" font-size="9.5" fill="#a7f3d0">v3 (latest)</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.2" marker-end="url(#p1)">
    <line x1="170" y1="413" x2="178" y2="413"/>
    <line x1="290" y1="413" x2="298" y2="413"/>
  </g>
  <text x="60" y="452" fill="#e8b0b0" font-size="10.5" font-weight="600">Cost: old versions cannot be cleaned while someone is looking at them</text>
  <text x="60" y="470" fill="#8a8aa0" font-size="10.5">One transaction open for hours holds every old version made in</text>
  <text x="60" y="486" fill="#8a8aa0" font-size="10.5">that time. The table swells and queries slow.</text>
  <text x="60" y="508" fill="#8a8aa0" font-size="10.5">This is the real basis of the advice to "keep transactions short".</text>

  <!-- write skew -->
  <rect x="510" y="322" width="450" height="200" rx="10" fill="#1f1418" stroke="#db8585"/>
  <text x="530" y="346" fill="#e8b0b0" font-size="12" font-weight="700">write skew – each is right, and together they are wrong</text>
  <text x="530" y="368" fill="#c8c8d8" font-size="10.5">Rule: at least one doctor must stay on call. Two are on call now.</text>
  <rect x="530" y="382" width="200" height="70" rx="6" fill="#1a1012" stroke="#db8585"/>
  <text x="546" y="400" class="mono" font-size="9.5" fill="#e8b0b0">T1: query on-call count → 2</text>
  <text x="546" y="416" class="mono" font-size="9.5" fill="#e8b0b0">"there is one besides me"</text>
  <text x="546" y="434" class="mono" font-size="9.5" fill="#e8b0b0">T1: drops its own on-call</text>

  <rect x="740" y="382" width="200" height="70" rx="6" fill="#1a1012" stroke="#db8585"/>
  <text x="756" y="400" class="mono" font-size="9.5" fill="#e8b0b0">T2: query on-call count → 2</text>
  <text x="756" y="416" class="mono" font-size="9.5" fill="#e8b0b0">"there is one besides me"</text>
  <text x="756" y="434" class="mono" font-size="9.5" fill="#e8b0b0">T2: drops its own on-call</text>

  <text x="530" y="472" fill="#db8585" font-size="10.5" font-weight="600">Result: nobody on call. Both transactions checked the rule and passed.</text>
  <text x="530" y="492" fill="#8a8aa0" font-size="10.5">They edited different rows, so it is not an update conflict either. Snapshot</text>
  <text x="530" y="508" fill="#8a8aa0" font-size="10.5">isolation does not stop it; serializable or an explicit lock is needed.</text>

  <!-- 타이밍 -->
  <rect x="40" y="538" width="920" height="182" rx="10" fill="#1a1420" stroke="#db8fb4"/>
  <text x="60" y="562" fill="#f0c0d8" font-size="12.5" font-weight="700">How the same structure becomes an information channel – blind SQL injection's time axis</text>
  <text x="60" y="584" fill="#c8c8d8" font-size="10.5">Even with no response content at all, making it slow only when the condition is true gains one bit per request.</text>
  <rect x="60" y="598" width="430" height="66" rx="7" fill="#1a1012" stroke="#db8585"/>
  <text x="76" y="618" fill="#e8b0b0" font-size="10.5" font-weight="600">Even with delay functions blocked</text>
  <text x="76" y="636" fill="#c8c8d8" font-size="10">just make an expensive operation run only when the condition is true.</text>
  <text x="76" y="654" fill="#8a8aa0" font-size="10">The time difference between an index path and a full scan is enough.</text>

  <rect x="510" y="598" width="450" height="66" rx="7" fill="#12201c" stroke="#34d399"/>
  <text x="526" y="618" fill="#a7f3d0" font-size="10.5" font-weight="600">So the defence is not "hiding the errors"</text>
  <text x="526" y="636" fill="#c8c8d8" font-size="10">Hide the error message and timing remains. Separate syntax from data</text>
  <text x="526" y="654" fill="#c8c8d8" font-size="10">with prepared statements, and fix identifier slots with an allow list.</text>

  <text x="60" y="690" fill="#8a8aa0" font-size="10.5">The performance structure seen in Part 13 becomes the attack surface as-is. Understanding indexes and understanding timing channels are two directions of the same knowledge.</text>
  <text x="60" y="710" fill="#f0c0d8" font-size="10.5" font-weight="600">In Part 15's archetypes this is the cell where D (side-effect observation) and A (syntax/data not separated) overlap.</text>
</svg>
