<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db8585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">배포 경로 – 요청이 앱에 닿기까지, 그리고 코드가 서버에 닿기까지</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">앞의 경로는 잘 지켜지고 뒤의 경로는 자주 잊힌다. 공격자는 둘 다 본다.</text>

  <!-- 요청 경로 -->
  <text x="40" y="90" fill="#8a8aa0" font-size="11" font-weight="600">① 사용자 요청 경로</text>
  <g text-anchor="middle">
    <rect x="40" y="102" width="132" height="56" rx="8" fill="#161226" stroke="#8b7cf6"/>
    <text x="106" y="124" fill="#d8d0f8" font-size="11" font-weight="600">브라우저</text>
    <text x="106" y="142" fill="#8a8aa0" font-size="9.5">신뢰할 수 없음</text>

    <rect x="196" y="102" width="132" height="56" rx="8" fill="#141a22" stroke="#6f9fd8"/>
    <text x="262" y="124" fill="#bcd6f0" font-size="11" font-weight="600">CDN · 엣지</text>
    <text x="262" y="142" fill="#8a8aa0" font-size="9.5">TLS 종료 · 캐시</text>

    <rect x="352" y="102" width="132" height="56" rx="8" fill="#141a22" stroke="#6f9fd8"/>
    <text x="418" y="124" fill="#bcd6f0" font-size="11" font-weight="600">로드밸런서</text>
    <text x="418" y="142" fill="#8a8aa0" font-size="9.5">분배 · 헬스체크</text>

    <rect x="508" y="102" width="132" height="56" rx="8" fill="#1f1a12" stroke="#e6a572"/>
    <text x="574" y="124" fill="#f0cba8" font-size="11" font-weight="600">리버스 프록시</text>
    <text x="574" y="142" fill="#8a8aa0" font-size="9.5">경로 라우팅 · 헤더 조작</text>

    <rect x="664" y="102" width="132" height="56" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="730" y="124" fill="#a7f3d0" font-size="11" font-weight="600">앱 서버</text>
    <text x="730" y="142" fill="#8a8aa0" font-size="9.5">비즈니스 로직</text>

    <rect x="820" y="102" width="140" height="56" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="890" y="124" fill="#a7f3d0" font-size="11" font-weight="600">DB · 캐시</text>
    <text x="890" y="142" fill="#8a8aa0" font-size="9.5">사설망 안</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.3" marker-end="url(#m1)">
    <line x1="172" y1="130" x2="194" y2="130"/>
    <line x1="328" y1="130" x2="350" y2="130"/>
    <line x1="484" y1="130" x2="506" y2="130"/>
    <line x1="640" y1="130" x2="662" y2="130"/>
    <line x1="796" y1="130" x2="818" y2="130"/>
  </g>

  <rect x="196" y="172" width="288" height="72" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="214" y="192" fill="#e8b0b0" font-size="10.5" font-weight="600">암호화가 끝나는 지점</text>
  <text x="214" y="210" fill="#c8c8d8" font-size="10">여기서부터 뒤는 평문이거나 별도의 내부 TLS다.</text>
  <text x="214" y="228" fill="#8a8aa0" font-size="10">평문을 읽고 고칠 수 있는 주체가 경로 중간에 존재한다.</text>

  <rect x="508" y="172" width="452" height="72" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="526" y="192" fill="#e8b0b0" font-size="10.5" font-weight="600">클라이언트 IP 는 여기서 "헤더에 적힌 값"이 된다</text>
  <text x="526" y="210" font-family="Menlo, monospace" font-size="10" fill="#c8c8d8">X-Forwarded-For: 1.2.3.4, 10.0.0.9, 10.0.0.3</text>
  <text x="526" y="228" fill="#8a8aa0" font-size="10">프록시가 들어오는 헤더를 지우지 않으면 클라이언트가 앞부분을 위조한다. 신뢰할 홉 수를 명시해야 한다.</text>

  <!-- 격리 -->
  <text x="40" y="280" fill="#8a8aa0" font-size="11" font-weight="600">② 실행 환경의 격리 – 무엇이 공유되는가</text>
  <rect x="40" y="292" width="450" height="130" rx="9" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="314" fill="#e8e8f0" font-size="11.5" font-weight="700">컨테이너</text>
  <text x="60" y="334" fill="#c8c8d8" font-size="10.5">네임스페이스(무엇을 보는가) + cgroups(얼마나 쓰는가)</text>
  <text x="60" y="350" fill="#c8c8d8" font-size="10.5">+ capabilities(무엇을 할 수 있는가) 의 조합</text>
  <text x="60" y="374" fill="#e8b0b0" font-size="10.5" font-weight="600">커널은 호스트와 공유한다 – 가상머신과 결정적으로 다른 점</text>
  <text x="60" y="392" fill="#8a8aa0" font-size="10.5">따라서 컨테이너 탈출은 대개 커널 취약점 공격이다.</text>
  <text x="60" y="410" fill="#8a8aa0" font-size="10.5">특권 모드 · 호스트 소켓 마운트 · root 실행이 그 문턱을 낮춘다.</text>

  <rect x="510" y="292" width="450" height="130" rx="9" fill="#12121f" stroke="#3a3a52"/>
  <text x="530" y="314" fill="#e8e8f0" font-size="11.5" font-weight="700">오케스트레이션</text>
  <text x="530" y="334" fill="#c8c8d8" font-size="10.5">API 서버가 단일 통제점이고, 그래서 단일 표적이다.</text>
  <text x="530" y="354" fill="#8a8aa0" font-size="10.5">· 네트워크 정책이 없으면 파드 사이는 평면 네트워크다</text>
  <text x="530" y="372" fill="#8a8aa0" font-size="10.5">  → 하나가 뚫리면 내부 전체가 사정권에 들어온다</text>
  <text x="530" y="392" fill="#8a8aa0" font-size="10.5">· 기본 시크릿은 암호화가 아니라 인코딩일 뿐이다</text>
  <text x="530" y="410" fill="#8a8aa0" font-size="10.5">· 서비스 계정 토큰이 파드 안에 마운트돼 있다</text>

  <!-- 공급망 -->
  <text x="40" y="458" fill="#8a8aa0" font-size="11" font-weight="600">③ 코드가 서버에 닿는 경로 – 사용자 요청보다 권한이 크다</text>
  <g text-anchor="middle">
    <rect x="40" y="470" width="150" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="115" y="490" fill="#c8c8d8" font-size="10.5">개발자 커밋</text>
    <text x="115" y="507" fill="#8a8aa0" font-size="9.5">의존성 수백 개 포함</text>

    <rect x="214" y="470" width="150" height="50" rx="8" fill="#1f1a12" stroke="#e6a572"/>
    <text x="289" y="490" fill="#f0cba8" font-size="10.5" font-weight="600">CI 러너</text>
    <text x="289" y="507" fill="#8a8aa0" font-size="9.5">배포 자격증명 보유</text>

    <rect x="388" y="470" width="150" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="463" y="490" fill="#c8c8d8" font-size="10.5">이미지 레지스트리</text>
    <text x="463" y="507" fill="#8a8aa0" font-size="9.5">태그는 움직인다</text>

    <rect x="562" y="470" width="150" height="50" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="637" y="490" fill="#a7f3d0" font-size="10.5">프로덕션 서버</text>
    <text x="637" y="507" fill="#8a8aa0" font-size="9.5">pull + 롤아웃</text>

    <rect x="736" y="470" width="224" height="50" rx="8" fill="#12121f" stroke="#3a3a52"/>
    <text x="848" y="490" fill="#c8c8d8" font-size="10.5">IaC · 상태 파일</text>
    <text x="848" y="507" fill="#8a8aa0" font-size="9.5">인프라 전체의 설계도와 비밀</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.3" marker-end="url(#m1)">
    <line x1="190" y1="495" x2="212" y2="495"/>
    <line x1="364" y1="495" x2="386" y2="495"/>
    <line x1="538" y1="495" x2="560" y2="495"/>
  </g>

  <rect x="40" y="540" width="920" height="168" rx="10" fill="#1f1418" stroke="#db8585"/>
  <text x="60" y="564" fill="#e8b0b0" font-size="12.5" font-weight="700">이 경로에서 반복되는 실패</text>
  <text x="60" y="588" fill="#c8c8d8" font-size="10.5">· 외부 기여자의 PR 이 시크릿에 접근 가능한 워크플로를 트리거한다 – 코드 리뷰 전에 코드가 실행되는 구조</text>
  <text x="60" y="608" fill="#c8c8d8" font-size="10.5">· 서드파티 액션·이미지를 움직이는 태그로 참조한다 – 같은 태그가 내일 다른 내용을 가리킬 수 있다 (해시로 고정해야 한다)</text>
  <text x="60" y="628" fill="#c8c8d8" font-size="10.5">· 내부 패키지 이름이 공개 레지스트리에서 선점된다 – 의존성 혼동(dependency confusion)</text>
  <text x="60" y="648" fill="#c8c8d8" font-size="10.5">· IaC 상태 파일이 평문 비밀을 담은 채 접근 통제 없는 버킷에 놓인다</text>
  <text x="60" y="668" fill="#c8c8d8" font-size="10.5">· 로그에 토큰·세션·개인정보가 그대로 남는다 – 로그 수집기는 대개 더 많은 사람이 접근한다</text>
  <text x="60" y="692" fill="#e8b0b0" font-size="10.5" font-weight="600">요약: 애플리케이션 취약점은 사용자 권한을 얻고, 파이프라인 취약점은 배포 권한을 얻는다. 후자가 항상 더 크다.</text>
</svg>
