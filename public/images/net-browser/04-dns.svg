<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f9fd8"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db8585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">DNS – 위임으로 쪼갠 이름 공간과, 시간에 따라 답이 바뀌는 성질</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">위: 한 번의 이름 해석이 실제로 밟는 경로 · 아래: 같은 이름의 두 번째 답이 달라질 때 생기는 일</text>

  <!-- ===== 상단: 재귀 해석 ===== -->
  <g text-anchor="middle">
    <rect x="40" y="96" width="128" height="52" rx="9" fill="#161226" stroke="#8b7cf6" stroke-width="1.5"/>
    <text x="104" y="118" fill="#e8e8f0" font-size="12" font-weight="600">브라우저</text>
    <text x="104" y="136" fill="#8a8aa0" font-size="10">stub resolver</text>

    <rect x="222" y="96" width="150" height="52" rx="9" fill="#141a22" stroke="#6f9fd8" stroke-width="1.5"/>
    <text x="297" y="118" fill="#bcd6f0" font-size="12" font-weight="600">재귀 리졸버</text>
    <text x="297" y="136" fill="#8a8aa0" font-size="10">캐시를 가진 유일한 지점</text>

    <rect x="436" y="78" width="120" height="44" rx="9" fill="#12121f" stroke="#3a3a52"/>
    <text x="496" y="96" fill="#c8c8d8" font-size="11">루트 (.)</text>
    <text x="496" y="112" fill="#8a8aa0" font-size="10">"com은 저쪽"</text>

    <rect x="596" y="78" width="120" height="44" rx="9" fill="#12121f" stroke="#3a3a52"/>
    <text x="656" y="96" fill="#c8c8d8" font-size="11">TLD (.com)</text>
    <text x="656" y="112" fill="#8a8aa0" font-size="10">"example은 저쪽"</text>

    <rect x="756" y="78" width="180" height="44" rx="9" fill="#101a18" stroke="#34d399" stroke-width="1.5"/>
    <text x="846" y="96" fill="#a7f3d0" font-size="11" font-weight="600">권한 있는 네임서버</text>
    <text x="846" y="112" fill="#8a8aa0" font-size="10">example.com의 실제 답</text>
  </g>

  <line x1="168" y1="122" x2="220" y2="122" stroke="#6f9fd8" stroke-width="1.5" marker-end="url(#d1)"/>
  <text x="194" y="114" text-anchor="middle" fill="#8a8aa0" font-size="9">재귀 질의</text>

  <g stroke="#5a5a78" stroke-width="1.3" marker-end="url(#d1)" fill="none">
    <path d="M 372 112 L 434 100"/>
    <path d="M 556 100 L 594 100"/>
    <path d="M 716 100 L 754 100"/>
  </g>
  <text x="640" y="66" text-anchor="middle" fill="#8a8aa0" font-size="10">반복 질의 — 각 단계는 "답"이 아니라 "다음에 물어볼 곳"을 준다 (위임)</text>

  <path d="M 846 122 L 846 158 L 297 158 L 297 150" stroke="#34d399" stroke-width="1.3" fill="none" marker-end="url(#d1)"/>
  <text x="580" y="174" text-anchor="middle" fill="#a7f3d0" font-size="10">A 레코드 + TTL → 리졸버가 TTL 동안 캐시한다</text>

  <rect x="40" y="188" width="896" height="54" rx="9" fill="#12121f" stroke="#3a3a52"/>
  <text x="58" y="210" fill="#e8e8f0" font-size="11" font-weight="600">TTL은 성능과 통제권 사이의 타협이다</text>
  <text x="58" y="230" fill="#c8c8d8" font-size="10.5">길면 — 질의 수가 줄고 루트/TLD 부하가 낮아진다. 대신 서버를 옮겨도 옛 주소로 오는 트래픽이 TTL 만큼 남는다.</text>
  <text x="640" y="230" fill="#8a8aa0" font-size="10.5">짧으면 — 전환이 빠르다. 대신 질의가 잦고, 공격자도 답을 자주 바꿀 수 있다.</text>

  <!-- ===== 하단: rebinding ===== -->
  <line x1="40" y1="268" x2="960" y2="268" stroke="#1e1e2e"/>
  <text x="40" y="294" fill="#e8b0b0" font-size="12" font-weight="700">DNS rebinding — 이름은 그대로, 주소만 바뀐다</text>

  <!-- step 1 -->
  <rect x="40" y="310" width="440" height="140" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="334" fill="#c8c8d8" font-size="11" font-weight="600">1단계 — 피해자가 공격자 페이지를 연다</text>
  <text x="60" y="358" fill="#8a8aa0" font-size="10.5">질의: evil.com → 답: 203.0.113.9 (공격자 서버), TTL = 1초</text>
  <text x="60" y="380" fill="#8a8aa0" font-size="10.5">브라우저가 evil.com 출처로 JS를 실행한다.</text>
  <rect x="60" y="394" width="400" height="42" rx="6" fill="#161226" stroke="#8b7cf6"/>
  <text x="76" y="412" fill="#d8d0f8" font-size="10.5">출처(origin) = https://evil.com</text>
  <text x="76" y="428" fill="#8a8aa0" font-size="10.5">SOP는 이 문자열을 기준으로 접근을 허용/차단한다.</text>

  <!-- step 2 -->
  <rect x="520" y="310" width="440" height="140" rx="10" fill="#1f1418" stroke="#db8585"/>
  <text x="540" y="334" fill="#e8b0b0" font-size="11" font-weight="600">2단계 — TTL 만료 후 같은 이름을 다시 묻는다</text>
  <text x="540" y="358" fill="#c8c8d8" font-size="10.5">질의: evil.com → 답: 192.168.0.1 (피해자 내부망)</text>
  <text x="540" y="380" fill="#c8c8d8" font-size="10.5">JS는 계속 evil.com 출처에 있으므로 SOP를 통과한다.</text>
  <rect x="540" y="394" width="400" height="42" rx="6" fill="#1a1012" stroke="#db8585"/>
  <text x="556" y="412" fill="#e8b0b0" font-size="10.5">소켓이 실제로 연결되는 곳 = 192.168.0.1</text>
  <text x="556" y="428" fill="#8a8aa0" font-size="10.5">브라우저의 신뢰 경계와 실제 도달 지점이 어긋난다.</text>
  <line x1="480" y1="380" x2="518" y2="380" stroke="#db8585" stroke-width="1.5" marker-end="url(#d2)"/>

  <rect x="40" y="470" width="920" height="128" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="58" y="494" fill="#e8e8f0" font-size="11.5" font-weight="600">이 공격이 성립하는 근본 이유</text>
  <text x="58" y="518" fill="#c8c8d8" font-size="11">브라우저의 접근 제어는 <tspan fill="#8b7cf6" font-weight="600">이름</tspan>을 기준으로 하고, 실제 통신은 <tspan fill="#db8585" font-weight="600">주소</tspan>를 기준으로 한다.</text>
  <text x="58" y="538" fill="#c8c8d8" font-size="11">이름에서 주소로 가는 변환은 시간에 따라 답이 달라질 수 있으므로, 두 기준이 가리키는 대상이 도중에 갈라진다.</text>
  <text x="58" y="566" fill="#8a8aa0" font-size="10.5">방어는 층마다 따로 선다 — 브라우저: DNS pinning · 리졸버: 사설 대역 응답 필터링(DNS rebinding protection)</text>
  <text x="58" y="584" fill="#8a8aa0" font-size="10.5">· 서버: Host 헤더 화이트리스트 검증(주소가 아니라 이름으로 자기 자신을 확인) · 내부 서비스: 인증을 네트워크 위치에 의존하지 않기</text>
</svg>
