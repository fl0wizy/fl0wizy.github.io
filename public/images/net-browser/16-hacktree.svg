<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="740" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">hack-tree – 이 시리즈의 계층이 하나의 배포된 시스템 안에서</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">각 상자 오른쪽 위의 번호는 그 구성요소를 다룬 편이다</text>

  <!-- CI -->
  <rect x="40" y="80" width="920" height="112" rx="10" fill="#1f1a12" stroke="#e6a572"/>
  <text x="60" y="104" fill="#f0cba8" font-size="12" font-weight="700">빌드 경로 – GitHub Actions</text>
  <text x="930" y="104" text-anchor="end" fill="#8a8aa0" font-size="10">14편</text>
  <g text-anchor="middle">
    <rect x="60" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="135" y="140" fill="#c8c8d8" font-size="10.5">테스트</text>
    <text x="135" y="158" fill="#8a8aa0" font-size="9.5">vitest · pytest · bats</text>

    <rect x="230" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="305" y="140" fill="#c8c8d8" font-size="10.5">이미지 빌드 ×3</text>
    <text x="305" y="158" fill="#8a8aa0" font-size="9.5">web · api · backup</text>

    <rect x="400" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="475" y="140" fill="#c8c8d8" font-size="10.5">GHCR push</text>
    <text x="475" y="158" fill="#8a8aa0" font-size="9.5">:latest + :&lt;commit sha&gt;</text>

    <rect x="570" y="118" width="150" height="54" rx="7" fill="#12121f" stroke="#3a3a52"/>
    <text x="645" y="140" fill="#c8c8d8" font-size="10.5">SSH 배포</text>
    <text x="645" y="158" fill="#8a8aa0" font-size="9.5">서버는 pull 만 한다</text>

    <rect x="740" y="118" width="200" height="54" rx="7" fill="#12201c" stroke="#34d399"/>
    <text x="840" y="140" fill="#a7f3d0" font-size="10.5">헬스체크 → 실패 시 롤백</text>
    <text x="840" y="158" fill="#8a8aa0" font-size="9.5">SHA 태그가 되돌릴 지점을 만든다</text>
  </g>
  <g stroke="#5a5a78" stroke-width="1.2" marker-end="url(#n1)">
    <line x1="210" y1="145" x2="228" y2="145"/>
    <line x1="380" y1="145" x2="398" y2="145"/>
    <line x1="550" y1="145" x2="568" y2="145"/>
    <line x1="720" y1="145" x2="738" y2="145"/>
  </g>

  <!-- 런타임 -->
  <rect x="40" y="208" width="920" height="286" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="232" fill="#e8e8f0" font-size="12" font-weight="700">런타임 – GCP VM (Ubuntu 24.04, 고정 IP) · Terraform + cloud-init 으로 코드화</text>
  <text x="930" y="232" text-anchor="end" fill="#8a8aa0" font-size="10">14편</text>

  <rect x="60" y="246" width="880" height="70" rx="8" fill="#141a22" stroke="#6f9fd8"/>
  <text x="78" y="268" fill="#bcd6f0" font-size="11.5" font-weight="600">Caddy – 외부에 열린 유일한 포트 :80 / :443</text>
  <text x="920" y="268" text-anchor="end" fill="#8a8aa0" font-size="10">05 · 10 · 14편</text>
  <text x="78" y="288" fill="#c8c8d8" font-size="10.5">자동 Let's Encrypt 인증서 · HSTS · nosniff · Referrer-Policy · Server 헤더 제거</text>
  <text x="78" y="306" fill="#8a8aa0" font-size="10.5">/api/* → api:8000 · 그 외 → web:3000  (TLS 는 여기서 끝난다 – 뒤는 내부 도커 네트워크)</text>

  <g>
    <rect x="60" y="330" width="280" height="90" rx="8" fill="#161226" stroke="#8b7cf6"/>
    <text x="78" y="352" fill="#d8d0f8" font-size="11.5" font-weight="600">web – Next.js 15 / React 19</text>
    <text x="322" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">09 · 11편</text>
    <text x="78" y="372" fill="#c8c8d8" font-size="10.5">마크다운 533개 노드 렌더링</text>
    <text x="78" y="390" fill="#8a8aa0" font-size="10.5">빌드타임에 임베딩·그래프·퀴즈 생성</text>
    <text x="78" y="408" fill="#8a8aa0" font-size="10.5">/api/* 리라이트 → 같은 출처, CORS 불필요</text>

    <rect x="360" y="330" width="280" height="90" rx="8" fill="#1a1420" stroke="#db8fb4"/>
    <text x="378" y="352" fill="#f0c0d8" font-size="11.5" font-weight="600">api – FastAPI / Python 3.12</text>
    <text x="622" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">12편</text>
    <text x="378" y="372" fill="#c8c8d8" font-size="10.5">쿠키 세션 · argon2 · RBAC · 초대제</text>
    <text x="378" y="390" fill="#8a8aa0" font-size="10.5">기동 시 alembic upgrade head</text>
    <text x="378" y="408" fill="#8a8aa0" font-size="10.5">퀴즈 정답키는 이 이미지에만 존재</text>

    <rect x="660" y="330" width="280" height="90" rx="8" fill="#12201c" stroke="#34d399"/>
    <text x="678" y="352" fill="#a7f3d0" font-size="11.5" font-weight="600">SQLite + 백업 사이드카</text>
    <text x="922" y="352" text-anchor="end" fill="#8a8aa0" font-size="10">13편</text>
    <text x="678" y="372" fill="#c8c8d8" font-size="10.5">진행도 · 퀴즈 결과 · 세션 · 뉴스</text>
    <text x="678" y="390" fill="#8a8aa0" font-size="10.5">sqlite3 .backup → integrity_check → 회전</text>
    <text x="678" y="408" fill="#8a8aa0" font-size="10.5">데이터 볼륨은 읽기 전용으로 마운트</text>
  </g>

  <rect x="60" y="434" width="880" height="46" rx="8" fill="#1f1418" stroke="#db8585"/>
  <text x="78" y="454" fill="#e8b0b0" font-size="11" font-weight="600">공개 회원가입 없음 – 초대제만</text>
  <text x="78" y="470" fill="#c8c8d8" font-size="10.5">기능을 빼서 공격면을 줄인 결정. 비밀번호 재설정·이메일 인증·스팸 대응·계정 열거가 통째로 사라진다.</text>

  <!-- 결정과 대가 -->
  <rect x="40" y="510" width="450" height="216" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="534" fill="#e8e8f0" font-size="12" font-weight="700">막혔던 자리와 그 해결</text>
  <text x="60" y="558" fill="#e6a572" font-size="10.5" font-weight="600">① alpine 에서 네이티브 모듈이 로드되지 않음</text>
  <text x="72" y="576" fill="#8a8aa0" font-size="10">검색용 ONNX 런타임과 이미지 처리 모듈이 glibc 전용</text>
  <text x="72" y="592" fill="#8a8aa0" font-size="10">prebuilt 를 받는다 → 전 스테이지를 slim(glibc)으로 통일</text>
  <text x="60" y="616" fill="#e6a572" font-size="10.5" font-weight="600">② 135MB 임베딩 모델을 어디에 둘 것인가</text>
  <text x="72" y="634" fill="#8a8aa0" font-size="10">Git LFS 는 대역폭 한도 때문에 포기. 대신 고정 revision 에서</text>
  <text x="72" y="650" fill="#8a8aa0" font-size="10">내려받고 sha256 을 검증하는 스크립트로 바꿨다.</text>
  <text x="72" y="666" fill="#34d399" font-size="10">→ 공급망 무결성이 부수 효과로 따라왔다 (14편)</text>
  <text x="60" y="690" fill="#e6a572" font-size="10.5" font-weight="600">③ 개발과 운영의 차이를 어디에 적을 것인가</text>
  <text x="72" y="708" fill="#8a8aa0" font-size="10">compose 파일 3개로 분리 – base / 개발 / 운영.</text>

  <rect x="510" y="510" width="450" height="216" rx="10" fill="#161226" stroke="#8b7cf6"/>
  <text x="530" y="534" fill="#d8d0f8" font-size="12" font-weight="700">이 프로젝트가 실제로 가르친 것</text>
  <text x="530" y="558" fill="#c8c8d8" font-size="10.5">· TLS 가 어디서 끝나는지는 배포 구성이 정한다 – 문서가 아니라</text>
  <text x="542" y="574" fill="#8a8aa0" font-size="10.5">  Caddyfile 한 줄이 그 경계를 옮긴다</text>
  <text x="530" y="596" fill="#c8c8d8" font-size="10.5">· 같은 출처로 프록시하면 CORS 설정 자체가 사라진다 – 헤더를</text>
  <text x="542" y="612" fill="#8a8aa0" font-size="10.5">  잘 쓰는 것보다 필요 없게 만드는 쪽이 안전하다</text>
  <text x="530" y="634" fill="#c8c8d8" font-size="10.5">· 정답키를 클라이언트에 안 보내는 유일한 방법은 그 파일을</text>
  <text x="542" y="650" fill="#8a8aa0" font-size="10.5">  정적 서빙 경로 밖에 두는 것이다 (11편의 서버/클라 경계)</text>
  <text x="530" y="672" fill="#c8c8d8" font-size="10.5">· 롤백이 가능한 배포는 태그가 결정한다 – 움직이는 태그로는</text>
  <text x="542" y="688" fill="#8a8aa0" font-size="10.5">  되돌릴 지점을 특정할 수 없다 (14편)</text>
  <text x="530" y="712" fill="#a7f3d0" font-size="10.5" font-weight="600">읽어서 아는 것과 배포해서 아는 것의 차이가 대부분 여기에 있었다.</text>
</svg>
