<svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a78"/>
    </marker>
    <marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db8585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="690" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">브라우저 프로세스 모델 – 신뢰 경계를 프로세스 경계로 만들기</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">렌더러는 공격자가 장악한다고 가정한다. 그 가정 위에서 무엇을 어디에 두는지가 설계 전부다.</text>

  <!-- 신뢰 구역 -->
  <rect x="40" y="80" width="440" height="250" rx="10" fill="#101a18" stroke="#34d399" stroke-width="1.5"/>
  <text x="60" y="104" fill="#a7f3d0" font-size="12.5" font-weight="700">신뢰 구역 – 사용자 권한 그대로</text>

  <rect x="60" y="118" width="400" height="70" rx="8" fill="#12201c" stroke="#34d399"/>
  <text x="78" y="140" fill="#e8e8f0" font-size="12" font-weight="600">브라우저 프로세스 (브로커)</text>
  <text x="78" y="160" fill="#c8c8d8" font-size="10.5">파일 접근 · 네트워크 요청 · 쿠키 저장소 · UI · 권한 결정</text>
  <text x="78" y="178" fill="#8a8aa0" font-size="10.5">렌더러의 모든 자원 요청이 여기를 통과해야 한다.</text>

  <rect x="60" y="200" width="192" height="56" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="78" y="222" fill="#c8c8d8" font-size="11">네트워크 프로세스</text>
  <text x="78" y="240" fill="#8a8aa0" font-size="10">소켓 · TLS · 쿠키 부착</text>

  <rect x="268" y="200" width="192" height="56" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="286" y="222" fill="#c8c8d8" font-size="11">GPU 프로세스</text>
  <text x="286" y="240" fill="#8a8aa0" font-size="10">래스터 · 합성 · 드라이버 접촉</text>

  <rect x="60" y="268" width="400" height="46" rx="8" fill="#12121f" stroke="#3a3a52"/>
  <text x="78" y="288" fill="#c8c8d8" font-size="11">유틸리티 프로세스</text>
  <text x="78" y="304" fill="#8a8aa0" font-size="10">이미지·오디오 디코딩 등 포맷 파싱을 따로 떼어 낸 곳</text>

  <!-- 비신뢰 구역 -->
  <rect x="520" y="80" width="440" height="250" rx="10" fill="#1f1418" stroke="#db8585" stroke-width="1.5"/>
  <text x="540" y="104" fill="#e8b0b0" font-size="12.5" font-weight="700">비신뢰 구역 – 샌드박스 안, 권한 박탈</text>

  <rect x="540" y="118" width="190" height="86" rx="8" fill="#161226" stroke="#8b7cf6"/>
  <text x="558" y="140" fill="#d8d0f8" font-size="11" font-weight="600">렌더러 A</text>
  <text x="558" y="158" fill="#8a8aa0" font-size="10">site: https://bank.com</text>
  <text x="558" y="176" fill="#8a8aa0" font-size="10">HTML 파싱 · DOM · CSS</text>
  <text x="558" y="194" fill="#8a8aa0" font-size="10">JS 엔진 · 레이아웃 · 페인트</text>

  <rect x="746" y="118" width="194" height="86" rx="8" fill="#1a1420" stroke="#db8fb4"/>
  <text x="764" y="140" fill="#f0c0d8" font-size="11" font-weight="600">렌더러 B</text>
  <text x="764" y="158" fill="#8a8aa0" font-size="10">site: https://ads.example</text>
  <text x="764" y="176" fill="#8a8aa0" font-size="10">A 페이지 안의 iframe이어도</text>
  <text x="764" y="194" fill="#8a8aa0" font-size="10">사이트가 다르면 별도 프로세스</text>

  <rect x="540" y="216" width="400" height="98" rx="8" fill="#1a1012" stroke="#db8585"/>
  <text x="558" y="238" fill="#e8b0b0" font-size="11" font-weight="600">렌더러가 직접 할 수 없는 것</text>
  <text x="558" y="258" fill="#c8c8d8" font-size="10.5">파일 열기 · 소켓 열기 · 쿠키 읽기 · 다른 프로세스 메모리 접근</text>
  <text x="558" y="278" fill="#8a8aa0" font-size="10.5">전부 IPC(Mojo)로 브로커에 요청하고, 브로커가 승인 여부를 정한다.</text>
  <text x="558" y="300" fill="#e8b0b0" font-size="10.5" font-weight="600">→ 렌더러를 완전히 장악해도 그것만으로는 파일 하나 못 읽는다.</text>

  <g stroke="#5a5a78" stroke-width="1.4" marker-end="url(#h1)">
    <line x1="538" y1="160" x2="462" y2="160"/>
    <line x1="462" y1="176" x2="538" y2="176"/>
  </g>
  <text x="500" y="204" text-anchor="middle" fill="#8a8aa0" font-size="9.5">IPC</text>

  <!-- Site Isolation -->
  <rect x="40" y="350" width="440" height="150" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="374" fill="#e8e8f0" font-size="12" font-weight="700">"사이트"의 정의 – 출처(origin)보다 거칠다</text>
  <text x="60" y="396" fill="#c8c8d8" font-size="10.5">스킴 + 등록 가능한 도메인(공개 접미사 포함). 서브도메인·포트·경로는 무시.</text>
  <rect x="60" y="408" width="400" height="44" rx="6" fill="#141a22" stroke="#6f9fd8"/>
  <text x="76" y="428" fill="#bcd6f0" font-size="11" font-family="Menlo, monospace">https://foo.example.com:8080</text>
  <text x="76" y="445" fill="#8a8aa0" font-size="11" font-family="Menlo, monospace">→ site = https://example.com</text>
  <text x="60" y="472" fill="#8a8aa0" font-size="10.5">왜 더 거칠게 잡았나 – document.domain 을 바꾸는 옛 페이지들과의 호환 때문.</text>
  <text x="60" y="490" fill="#e6a572" font-size="10.5" font-weight="600">그 대가: 서브도메인끼리는 프로세스가 분리되지 않는다.</text>

  <!-- 동기 -->
  <rect x="520" y="350" width="440" height="150" rx="10" fill="#1f1a12" stroke="#e6a572"/>
  <text x="540" y="374" fill="#f0cba8" font-size="12" font-weight="700">이 비용을 감수한 동기</text>
  <text x="540" y="396" fill="#c8c8d8" font-size="10.5">① 렌더러는 결국 뚫린다 – Chrome 버전당 렌더러의 high/critical 버그가</text>
  <text x="552" y="412" fill="#8a8aa0" font-size="10.5">   5~15개 수준으로 보고돼 왔다.</text>
  <text x="540" y="434" fill="#c8c8d8" font-size="10.5">② UXSS – 렌더러 안에서 동일 출처 정책을 우회하는 버그 계열.</text>
  <text x="540" y="456" fill="#c8c8d8" font-size="10.5">③ Spectre – Chrome에 버그가 없어도 렌더러 메모리를 읽을 수 있다.</text>
  <text x="540" y="480" fill="#e6a572" font-size="10.5" font-weight="600">결론: 읽히면 안 되는 데이터는 애초에 그 프로세스에 두지 않는다.</text>

  <!-- 2단계 -->
  <rect x="40" y="520" width="920" height="150" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="544" fill="#e8e8f0" font-size="12.5" font-weight="700">그래서 브라우저 익스플로잇은 항상 두 단계다</text>

  <rect x="60" y="558" width="400" height="46" rx="7" fill="#1f1418" stroke="#db8585"/>
  <text x="78" y="578" fill="#e8b0b0" font-size="11" font-weight="600">1단계 – 렌더러 내부 코드 실행</text>
  <text x="78" y="594" fill="#8a8aa0" font-size="10.5">JS 엔진 · 파서 · DOM 구현의 메모리 버그</text>

  <line x1="466" y1="580" x2="516" y2="580" stroke="#db8585" stroke-width="1.6" marker-end="url(#h2)"/>

  <rect x="530" y="558" width="430" height="46" rx="7" fill="#1f1418" stroke="#db8585"/>
  <text x="548" y="578" fill="#e8b0b0" font-size="11" font-weight="600">2단계 – 샌드박스 탈출</text>
  <text x="548" y="594" fill="#8a8aa0" font-size="10.5">IPC 경계의 검증 누락, 또는 커널·드라이버 취약점</text>

  <text x="60" y="628" fill="#c8c8d8" font-size="10.5">1단계만으로는 그 사이트의 데이터에만 닿는다. 기기를 장악하려면 2단계가 필요하고, 그래서 브라우저 익스플로잇은 체인이 된다.</text>
  <text x="60" y="650" fill="#8a8aa0" font-size="10.5">데스크톱에서 이 구조의 메모리 오버헤드는 탭이 많을 때 10~13% 수준으로 보고된다. 보안을 메모리로 사는 거래다.</text>
</svg>
