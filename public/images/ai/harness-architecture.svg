<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" width="100%" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1560" height="1000" fill="#ffffff"/>
<defs>
<marker id="ah0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e1e1e"/></marker>
<marker id="ah1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e44"/></marker>
<marker id="ah2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7048e8"/></marker>
<marker id="ah3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e8590c"/></marker>
</defs>
<text x="40" y="48" fill="#1971c2" font-size="28" font-weight="600" text-anchor="start" xml:space="preserve">
<tspan x="40" dy="0">AI 에이전트 실행 구조 – Agent = Model + Harness</tspan>
</text>
<text x="40" y="78" fill="#495057" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="40" dy="0">누가 무엇을 실행하는가: 하네스(로컬) / 모델(원격)의 경계</tspan>
</text>
<line x1="900" y1="110" x2="900" y2="900" stroke="#e03131" stroke-width="2" stroke-dasharray="10 8"/>
<text x="560" y="135" fill="#2f9e44" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="560" dy="0">◀  local  (내 컴퓨터 = 하네스 영역)</tspan>
</text>
<text x="915" y="135" fill="#e8590c" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="915" dy="0">remote  (제공자 인프라)  ▶</tspan>
</text>
<text x="925" y="864" fill="#e03131" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="925" dy="0">★ 이 선을 넘는 순간 문자열 → 토큰.</tspan>
<tspan x="925" dy="17.5">   토큰화는 하네스가 아니라</tspan>
<tspan x="925" dy="17.5">   제공자 서버가 한다.</tspan>
</text>
<rect x="40" y="400" width="190" height="100" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="135.0" y="444.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="135.0" dy="0">User</tspan>
</text>
<text x="135.0" y="470.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="135.0" dy="0">사람</tspan>
</text>
<rect x="370" y="360" width="300" height="180" rx="14" fill="#a5d8ff" stroke="22" stroke-width="2"/>
<text x="520.0" y="444.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="520.0" dy="0">Claude Code</tspan>
</text>
<text x="520.0" y="470.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="520.0" dy="0">= 하네스 (Harness)</tspan>
</text>
<rect x="370" y="700" width="300" height="100" rx="14" fill="#b2f2bb" stroke="17" stroke-width="2"/>
<text x="520.0" y="744.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="520.0" dy="0">MCP 서버 (local)</tspan>
</text>
<text x="520.0" y="770.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="520.0" dy="0">client tool · 내가 통제</tspan>
</text>
<rect x="1010" y="180" width="300" height="110" rx="14" fill="#d0bfff" stroke="20" stroke-width="2"/>
<text x="1160.0" y="229.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">미들웨어</tspan>
</text>
<text x="1160.0" y="255.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">프록시·게이트웨이(선택)</tspan>
</text>
<rect x="1010" y="400" width="300" height="140" rx="14" fill="#ffc9c9" stroke="24" stroke-width="2"/>
<text x="1160.0" y="464.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">LLM</tspan>
</text>
<text x="1160.0" y="490.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">모델 가중치 = 엔진</tspan>
</text>
<rect x="1010" y="700" width="300" height="100" rx="14" fill="#ffd8a8" stroke="17" stroke-width="2"/>
<text x="1160.0" y="744.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">server tool</tspan>
</text>
<text x="1160.0" y="770.875" fill="#495057" font-size="13" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="1160.0" dy="0">제공자가 실행 · web search 등</tspan>
</text>
<rect x="70" y="580" width="260" height="190" rx="14" fill="#e7f5ff" stroke="14" stroke-width="2"/>
<text x="200.0" y="681.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="200.0" dy="0"></tspan>
</text>
<text x="88" y="612" fill="#1971c2" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="88" dy="0">하네스 내부 부품</tspan>
</text>
<text x="88" y="637" fill="#343a40" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="88" dy="0">· 시스템 프롬프트 / CLAUDE.md</tspan>
<tspan x="88" dy="16.25">· 컨텍스트 조립기</tspan>
<tspan x="88" dy="16.25">· 도구 실행기</tspan>
<tspan x="88" dy="16.25">· 권한 게이트 (allow/ask/deny)</tspan>
<tspan x="88" dy="16.25">· Hooks (집행 장치)</tspan>
<tspan x="88" dy="16.25">· 메모리 · 오케스트레이션 루프</tspan>
</text>
<line x1="232" y1="425" x2="366" y2="425" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
<text x="238" y="410" fill="#2f9e44" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="238" dy="0">① 프롬프트(자연어)</tspan>
</text>
<line x1="366" y1="478" x2="232" y2="478" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
<text x="238" y="500" fill="#2f9e44" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="238" dy="0">⑨ 결과 보고</tspan>
</text>
<line x1="675" y1="405" x2="1006" y2="405" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
<text x="690" y="366" fill="#1971c2" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="690" dy="0">② 조립된 요청 (JSON 문자열)</tspan>
<tspan x="690" dy="17.5">   시스템 프롬프트 + 대화 + 도구 정의</tspan>
</text>
<line x1="1006" y1="500" x2="675" y2="500" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/>
<text x="690" y="520" fill="#c2255c" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="690" dy="0">③ output token = tool_use</tspan>
<tspan x="690" dy="17.5">   &quot;1번 MCP 호출해. A 사이트 HTML 읽어&quot;</tspan>
</text>
<line x1="672" y1="380" x2="1006" y2="250" stroke="#7048e8" stroke-width="2" marker-end="url(#ah2)"/>
<line x1="1006" y1="285" x2="1080" y2="396" stroke="#7048e8" stroke-width="2" marker-end="url(#ah2)"/>
<text x="700" y="223" fill="#7048e8" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="700" dy="0">② &#x27; 미들웨어를 두면 요청·응답을 모두 가로챈다</tspan>
<tspan x="700" dy="16.25">   (로깅 · 라우팅 · 캐싱 · 비용집계 · 가드레일)</tspan>
</text>
<line x1="470" y1="545" x2="470" y2="696" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah1)"/>
<text x="110" y="814" fill="#2f9e44" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="110" dy="0">④ 실제 실행 – 하네스가 한다</tspan>
<tspan x="110" dy="17.5">   (모델이 아니라)</tspan>
</text>
<line x1="570" y1="696" x2="570" y2="545" stroke="#2f9e44" stroke-width="2" marker-end="url(#ah1)"/>
<text x="600" y="633" fill="#2f9e44" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="600" dy="0">⑤ 결과 → ⑥ 관찰 메시지로 포장 → ⑦ 다시 ②로</tspan>
</text>
<line x1="1160" y1="545" x2="1160" y2="696" stroke="#e8590c" stroke-width="2" marker-end="url(#ah3)"/>
<line x1="1240" y1="696" x2="1240" y2="545" stroke="#e8590c" stroke-width="2" marker-end="url(#ah3)"/>
<text x="1330" y="623" fill="#e8590c" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="1330" dy="0">⑧ server tool은</tspan>
<tspan x="1330" dy="16.25">   내 훅으로 못 막는다</tspan>
</text>
<rect x="370" y="840" width="480" height="110" rx="14" fill="#fff9db" stroke="14" stroke-width="2"/>
<text x="610.0" y="901.75" fill="#1e1e1e" font-size="18" font-weight="400" text-anchor="middle" xml:space="preserve">
<tspan x="610.0" dy="0"></tspan>
</text>
<text x="392" y="872" fill="#e8590c" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="392" dy="0">핵심 3문장</tspan>
</text>
<text x="392" y="897" fill="#343a40" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">
<tspan x="392" dy="0">1. 모델은 네트워크를 직접 찌르지 않는다. 요청을 &#x27;출력&#x27;할 뿐이다.</tspan>
<tspan x="392" dy="16.25">2. 하네스를 움직이는 방아쇠는 LLM의 output token이다.</tspan>
<tspan x="392" dy="16.25">3. 단, 하네스는 LLM 호출 &#x27;이전&#x27;에도 프롬프트를 조립하며 움직인다.</tspan>
</text>
</svg>